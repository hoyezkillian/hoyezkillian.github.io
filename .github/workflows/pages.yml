name: pages build and deployment

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Pages
        uses: actions/configure-pages@v5
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: .

  deploy:
    runs-on: ubuntu-latest
    needs: build
    environment:
      name: github-pages
      url: ${{ steps.deploy_primary.outputs.page_url || steps.deploy_retry.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deploy_primary
        uses: actions/deploy-pages@v5
        continue-on-error: true

      - name: Retry deploy to GitHub Pages once
        if: steps.deploy_primary.outcome == 'failure'
        id: deploy_retry
        uses: actions/deploy-pages@v5
